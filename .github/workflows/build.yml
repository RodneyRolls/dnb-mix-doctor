name: Build Fix Dr

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            configure: cmake -B build -A x64
            targets: FixDr_VST3 FixDr_Standalone
          - os: macos-latest
            name: macOS
            configure: cmake -B build -G Xcode
            targets: FixDr_VST3 FixDr_AU FixDr_Standalone
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: ${{ matrix.configure }}

      - name: Build plugin
        run: cmake --build build --config Release --target ${{ matrix.targets }}

      - name: Build and run DSP tests
        shell: bash
        run: |
          cmake --build build --config Release --target DnBMixDoctorTests
          exe=$(find build -type f \( -name DnBMixDoctorTests.exe -o -name DnBMixDoctorTests \) -perm -u+x | head -1)
          "$exe"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Fix-Dr-${{ matrix.name }}
          path: |
            build/FixDr_artefacts/Release/VST3
            build/FixDr_artefacts/Release/AU
            build/FixDr_artefacts/Release/Standalone
          if-no-files-found: error
